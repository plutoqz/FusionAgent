name: ci

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEOFUSION_KG_BACKEND: memory
      GEOFUSION_LLM_PROVIDER: mock
      GEOFUSION_CELERY_EAGER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify frozen KG release
        run: |
          python scripts/verify_kg_release.py \
            --release-dir kg/ontology/v1.0.0 \
            --report-path tmp/ci-kg-verification-report.json
      - name: Run fast runtime smoke
        run: |
          python -c "import main"
          python scripts/runtime_doctor.py --mode fast
      - name: Run backend regression suite
        run: python -m pytest tests -q

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
